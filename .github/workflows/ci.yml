# CI minimo — issue #21, conforme plano aprovado (CI_PLAN §4, issue #3).
# Flutter 3.47.7 pinado: versão estável alvo (issue #52 — upgrade de 3.29.3):
# `flutter pub get` deixa pubspec.lock imutavel e 35/35 testes passam.
# Ratchets de analyze/format sao limiares explicitos versionados, nao
# continue-on-error. Nenhum check se autodeclara obrigatorio: nomes/origem
# sao documentados em tooling/ci/README.md para exigencia administrativa.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-unit:
    name: ci/flutter-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: deps reproduziveis — lock imutavel (Via A)
        run: ./tooling/ci/lock_check.sh
      - name: testes unitarios de modelos
        run: flutter test test/models

  flutter-analyze:
    name: ci/flutter-analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: analyze com ratchet (baseline 103)
        run: ./tooling/ci/analyze_ratchet.sh

  dart-format:
    name: ci/dart-format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: format com ratchet (baseline 24 arquivos)
        run: ./tooling/ci/format_ratchet.sh

  docs-integrity:
    name: ci/docs-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: diff sem erros de whitespace
        run: git diff --check origin/main...HEAD

  secrets-scan:
    name: ci/secrets-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'

  # Baseline E2E em emulador contra PocketBase efêmero (schema real via
  # ops/pocketbase/pb_migrations + seed sintético). Não toca em produção;
  # remove a dependência de tablet físico para a walkthrough operacional.
  e2e-emulator:
    name: ci/e2e-emulator
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: PocketBase efêmero (schema real + seed sintético)
        run: |
          curl -sLO https://github.com/pocketbase/pocketbase/releases/download/v0.36.2/pocketbase_0.36.2_linux_amd64.zip
          unzip -q pocketbase_0.36.2_linux_amd64.zip -d /tmp/pb-bin
          PB_BIN=/tmp/pb-bin/pocketbase ./ops/pocketbase/seed_ci.sh
      - name: flutter pub get
        run: flutter pub get
      - name: baseline walkthrough em emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: Nexus 6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            flutter test integration_test/baseline_operational_walkthrough.dart \
              -d emulator-5554 --flavor staging \
              --dart-define=PB_URL=http://10.0.2.2:8090 \
              --dart-define=TEST_GESTOR_EMAIL=gestor-e2e@example.invalid \
              --dart-define=TEST_GESTOR_PASSWORD=e2e-gestor-sintetico
      - name: log do PB efêmero (falha)
        if: failure()
        run: cat /tmp/jalapao-e2e-pb.log || true
